spring.application.name=GatewayApplication

server.port=8085
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


logging.level.org.springframework.cloud.gateway=DEBUG

spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].id=recognition-service
spring.cloud.gateway.routes[1].uri=lb://recognition-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/recognition/**

spring.cloud.gateway.routes[2].id=reward-service
spring.cloud.gateway.routes[2].uri=lb://reward-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/rewards/**

spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://notification-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**